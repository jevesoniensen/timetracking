name: Build Windows 11

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 11 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: time-tracker-ui/package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            time_tracker_event_reader
            time_tracker_app

      - name: Run Rust library tests
        working-directory: time_tracker_event_reader
        run: cargo test

      - name: Build Time Tracker App (UI + Server + JRE + Desktop App)
        working-directory: time_tracker_app
        run: cargo build --release

      - name: Stage Windows 11 release bundle
        shell: pwsh
        run: |
          $bundleDir = "dist/TimeTracker-win11-x64"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

          Copy-Item "time_tracker_app/target/release/time_tracker_app.exe" -Destination $bundleDir
          Copy-Item "time_tracker_app/target/release/time-tracker-server.jar" -Destination $bundleDir
          Copy-Item "time_tracker_app/target/release/jre" -Destination "$bundleDir/jre" -Recurse
          Copy-Item "time-tracker-local-server/src/main/resources/config.properties" -Destination $bundleDir

      - name: Upload Windows 11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-win11-x64
          path: dist/TimeTracker-win11-x64/
          if-no-files-found: error

