def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def releaseBuild = project.hasProperty('release')
def cargoArgs = releaseBuild ? ['build', '--release'] : ['build']

def configureRustEnv = { Exec execTask ->
    def rustBin = isWindows ? file('D:/dev/sdk/rust/bin') : null
    def currentPath = System.getenv('PATH') ?: ''
    if (rustBin != null && rustBin.exists()) {
        execTask.environment 'PATH', "${rustBin.absolutePath};${currentPath}"
    }
}

def cargoExecutable = { ->
    if (isWindows) {
        def sdkCargo = file('D:/dev/sdk/rust/bin/cargo.exe')
        if (sdkCargo.exists()) {
            return sdkCargo.absolutePath
        }
        def userCargo = new File(System.getProperty('user.home'), '.cargo/bin/cargo.exe')
        if (userCargo.exists()) {
            return userCargo.absolutePath
        }
    }
    return 'cargo'
}

tasks.register('buildReactApp', Exec) {
    group = 'build'
    description = 'Builds the React UI.'
    workingDir file('time-tracker-ui')

    if (isWindows) {
        // Inject the venv Scripts directory into PATH so both 'npm' and 'node' are located.
        def venvScripts = file('venv/Scripts').absolutePath
        environment 'PATH', "${venvScripts};" + (System.getenv('PATH') ?: '')
        commandLine 'cmd', '/c', 'npm install && npm run build'
    } else {
        def venvBin = file('venv/bin').absolutePath
        environment 'PATH', "${venvBin}:" + (System.getenv('PATH') ?: '')
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

tasks.register('copyReactBuild', Sync) {
    group = 'build'
    description = 'Copies the React UI build output into Spring Boot static resources.'
    dependsOn 'buildReactApp'
    from file('time-tracker-ui/dist')
    into file('time-tracker-local-server/src/main/resources/static')
}

project(':time-tracker-local-server').tasks.matching { it.name == 'processResources' }.configureEach {
    dependsOn rootProject.tasks.named('copyReactBuild')
}

tasks.register('buildSpringBoot') {
    group = 'build'
    description = 'Builds the Spring Boot server (and embedded React UI).'
    dependsOn ':time-tracker-local-server:bootJar'
}

tasks.register('buildEventReader', Exec) {
    group = 'build'
    description = 'Builds the Rust Windows event reader library after Spring Boot.'
    dependsOn 'buildSpringBoot'
    workingDir file('time_tracker_event_reader')
    configureRustEnv(it)
    commandLine([cargoExecutable()] + cargoArgs)
}

tasks.register('buildTimeTrackerApp', Exec) {
    group = 'build'
    description = 'Builds the desktop application after Spring Boot and event reader.'
    dependsOn 'buildEventReader'
    workingDir file('time_tracker_app')
    configureRustEnv(it)
    environment 'TIME_TRACKER_SKIP_SERVER_BUILD', '1'
    commandLine([cargoExecutable()] + cargoArgs)

    doLast {
        def profileName = releaseBuild ? 'release' : 'debug'
        def profileDir = file("time_tracker_app/target/${profileName}")
        profileDir.mkdirs()

        // 1. Always copy the latest Spring Boot executable jar into target/<profile>/time-tracker-server.jar
        def libsDir = file('time-tracker-local-server/build/libs')
        def bootJarFile = libsDir.listFiles()?.findAll {
            it.isFile() && it.name.endsWith('.jar') && !it.name.endsWith('-plain.jar')
        }?.max { it.lastModified() }

        if (bootJarFile == null || !bootJarFile.exists()) {
            throw new GradleException("No Spring Boot executable jar found in ${libsDir}")
        }
        def targetJar = new File(profileDir, 'time-tracker-server.jar')
        java.nio.file.Files.copy(
            bootJarFile.toPath(),
            targetJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        logger.lifecycle("Copied ${bootJarFile.name} -> ${targetJar}")

        // 2. Ensure default config.properties exists next to the executable
        def srcConfig = file('time_tracker_app/config.properties')
        def dstConfig = new File(profileDir, 'config.properties')
        if (srcConfig.exists() && !dstConfig.exists()) {
            java.nio.file.Files.copy(srcConfig.toPath(), dstConfig.toPath())
        }

        // 3. Ensure embedded minimal JRE exists next to the executable
        def jreDir = new File(profileDir, 'jre')
        def javaExeName = isWindows ? 'java.exe' : 'java'
        def targetJavaExe = new File(new File(jreDir, 'bin'), javaExeName)
        if (!targetJavaExe.exists()) {
            if (jreDir.exists()) {
                jreDir.deleteDir()
            }
            def jlinkExeName = isWindows ? 'jlink.exe' : 'jlink'
            def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
            def jlinkFile = new File(new File(javaHome, 'bin'), jlinkExeName)
            def jlinkCmd = jlinkFile.exists() ? jlinkFile.absolutePath : jlinkExeName
            def modules = [
                'java.base',
                'java.logging',
                'java.naming',
                'java.desktop',
                'java.management',
                'java.security.jgss',
                'java.instrument',
                'java.sql',
                'java.xml',
                'java.net.http',
                'jdk.unsupported',
            ].join(',')

            logger.lifecycle("Creating embedded minimal JRE at ${jreDir}...")
            def proc = new ProcessBuilder(
                jlinkCmd,
                '--no-header-files',
                '--no-man-pages',
                '--strip-debug',
                '--add-modules', modules,
                '--output', jreDir.absolutePath
            ).inheritIO().start()
            int exitCode = proc.waitFor()
            if (exitCode != 0) {
                throw new GradleException("jlink failed with exit code ${exitCode}")
            }
        }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds Spring Boot, event reader, and time_tracker_app in order.'
    dependsOn 'buildTimeTrackerApp'
}

tasks.register('cleanEventReader', Exec) {
    group = 'build'
    workingDir file('time_tracker_event_reader')
    configureRustEnv(it)
    commandLine(cargoExecutable(), 'clean')
}

tasks.register('cleanTimeTrackerApp', Exec) {
    group = 'build'
    workingDir file('time_tracker_app')
    configureRustEnv(it)
    commandLine(cargoExecutable(), 'clean')
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans Spring Boot, event reader, and time_tracker_app build outputs.'
    dependsOn ':time-tracker-local-server:clean', 'cleanEventReader', 'cleanTimeTrackerApp'
}

defaultTasks 'build'

