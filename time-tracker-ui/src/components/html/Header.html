<header class="app-header">
  <div class="header-left">
    <div class="brand-logo">
      <img [src]="clockIcon" alt="" class="brand-icon" />
    </div>
    <div class="brand-text">
      <h1>TimeTracker</h1>
    </div>
  </div>

  <div class="header-right">
    <button
      mat-stroked-button
      class="btn btn-secondary"
      (click)="openCustomWorkDay.emit()"
      matTooltip="Add a custom day of work from scratch"
    >
      <img [src]="calendarPlusIcon" alt="" class="btn-icon" />
      <span>Add Work Day</span>
    </button>

    <button
      mat-stroked-button
      class="btn btn-secondary"
      (click)="openVacation.emit()"
      matTooltip="Enter vacation by single day or period"
    >
      <img [src]="sunIcon" alt="" class="btn-icon" />
      <span>Vacation</span>
    </button>

    <button
      mat-stroked-button
      class="btn btn-secondary"
      (click)="refresh.emit()"
      [disabled]="isLoading"
      matTooltip="Refresh Events from Windows logs"
    >
      <img [src]="refreshIcon" alt="" class="btn-icon" [class.spinning]="isLoading" />
      <span>{{ isLoading ? 'Syncing...' : 'Refresh' }}</span>
    </button>

    <button
      mat-flat-button
      class="btn btn-primary"
      (click)="exportCsv.emit()"
      [matTooltip]="'Export ' + activeMonthLabel + ' as CSV'"
    >
      <img [src]="downloadIcon" alt="" class="btn-icon" />
      <span>Export CSV</span>
    </button>

    <div class="header-menu-wrapper">
      <button
        mat-icon-button
        type="button"
        class="btn btn-secondary btn-more"
        [matMenuTriggerFor]="moreMenu"
        matTooltip="More options"
        aria-label="More options"
      >
        <img [src]="moreVerticalIcon" alt="" class="btn-icon" />
      </button>

      <mat-menu #moreMenu="matMenu" xPosition="before" class="dark-mat-menu">
        <button
          mat-menu-item
          type="button"
          class="header-dropdown-item"
          (click)="selectUpload('events')"
        >
          <img [src]="uploadIcon" alt="" class="btn-icon" />
          <span>Upload Log</span>
        </button>

        <button
          mat-menu-item
          type="button"
          class="header-dropdown-item"
          (click)="selectUpload('overrides')"
        >
          <img [src]="editIcon" alt="" class="btn-icon" />
          <span>Upload Overrides</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
